# ============================================================================
# Weather Pipeline — entorno local
# Airflow 3.3.2 (LocalExecutor) + Postgres para metadatos + Postgres warehouse
# ============================================================================

# --- Bloque reutilizable (ancla YAML) con la config común de Airflow --------
x-airflow-common: &airflow-common
  build: .                                  # imagen propia: Dockerfile de este repo
  image: weather-pipeline/airflow:3.3.2
  env_file: .env
  environment: &airflow-common-env
    # Executor: las tareas corren como subprocesos del scheduler (sin Redis/Celery)
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Base de METADATOS de Airflow (no es el warehouse)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadata-db/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    # Airflow 3: los procesos que ejecutan tareas hablan con el api-server por HTTP
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Nuestro código de negocio (src/weather) importable desde los DAGs
    PYTHONPATH: /opt/airflow/src
    # Webhook de alertas (Slack/Discord/...). Vacío = las alertas solo van al log
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    # Connection al warehouse definida por variable de entorno (id: warehouse_db)
    AIRFLOW_CONN_WAREHOUSE_DB: >-
      {"conn_type": "postgres", "host": "warehouse-db", "port": 5432,
       "schema": "${WAREHOUSE_DB}", "login": "${WAREHOUSE_USER}",
       "password": "${WAREHOUSE_PASSWORD}"}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql:ro      # la tarea apply_schema lee de aquí el DDL
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-metadata-db:
      condition: service_healthy
    warehouse-db:
      condition: service_healthy

services:
  # --- Base de metadatos de Airflow (estado de DAGs, runs, tareas, usuarios) --
  airflow-metadata-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # --- Data warehouse: aquí viven raw / staging / core ------------------------
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    ports:
      - "5433:5432"                         # 5433 en tu máquina para no chocar con un Postgres local
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro   # se ejecuta SOLO con el volumen vacío
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # --- Inicialización única: migra la BD de metadatos y crea el usuario admin -
  airflow-init:
    <<: *airflow-common
    command: version                        # el entrypoint hace migrate + user create antes
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  # --- API server: UI web + REST API + Execution API (Airflow 3) --------------
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # --- Scheduler: decide qué tareas corren y (con LocalExecutor) las ejecuta --
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy

  # --- DAG processor: parsea los archivos de dags/ y los guarda serializados --
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-metadata-data:
  warehouse-data:
